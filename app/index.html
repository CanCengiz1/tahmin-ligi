<style>
  :root{--bg:#0B0D10;--panel:#14181E;--line:#252C36;--accent:#C8D2E0;--text:#EDF1F6;--dim:#7D8794;--display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;transition:background .3s ease;padding-bottom:calc(96px + env(safe-area-inset-bottom))}.wrap{max-width:480px;margin:0 auto}button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}input{font:inherit}.d{font-family:var(--display);letter-spacing:.01em}.num{font-family:var(--display);font-variant-numeric:tabular-nums}

  .strip{padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}.strip b{color:var(--accent);font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}.pad{padding:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}.card .top{padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.opp{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.1}.meta{font-size:12px;color:var(--dim);margin-top:2px}.chip{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;padding:3px 8px;border:1px solid var(--line);border-radius:4px;color:var(--dim);white-space:nowrap}.chip.hit{background:var(--accent);color:#0B0D10;border-color:var(--accent)}
