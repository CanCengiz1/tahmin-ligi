<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0D10">
<title>Tahmin Ligi — GS & FB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D10; --panel:#14181E; --line:#252C36;
    --accent:#C8D2E0; --text:#EDF1F6; --dim:#7D8794;
    --display:'Barlow Condensed','Arial Narrow',sans-serif;
    --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--body);
    min-height:100vh; transition:background .3s ease;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:480px;margin:0 auto}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input{font:inherit}
  .d{font-family:var(--display);letter-spacing:.01em}
  .num{font-family:var(--display);font-variant-numeric:tabular-nums}

  /* Giriş ekranı */
  #join{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 24px}
  .shake{width:100%;max-width:340px;display:block;margin:0 auto 26px}
  h1.big{font-family:var(--display);font-size:52px;font-weight:800;text-transform:uppercase;line-height:.95;margin:0 0 8px;overflow-wrap:anywhere}
  .lead{font-size:14px;color:var(--dim);line-height:1.6;margin:0 0 32px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);display:block;margin-bottom:8px}
  .field{width:100%;padding:14px 16px;border-radius:6px;background:#14181E;border:1px solid #252C36;color:var(--text);outline:none;margin-bottom:16px}
  .field:focus{border-color:var(--accent)}
  .primary{width:100%;padding:16px;border-radius:6px;background:var(--text);color:#0B0D10;font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:13px}
  .primary[disabled]{background:#252C36;color:#5A6472}
  .back{display:block;width:100%;text-align:center;padding:14px 0 0;font-size:13px;color:var(--dim)}
  .fine{font-size:12px;color:#5A6472;line-height:1.6;margin-top:24px}

  /* Başlık + sekmeler */
  header{padding:24px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  header h1{flex:none}
  header h1{font-family:var(--display);font-size:30px;font-weight:800;text-transform:uppercase;margin:0;line-height:1}
  header span{font-size:12px;color:var(--dim)}
  header .out{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  header .out:active{background:var(--panel)}
  nav{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
  nav button{padding:14px 0;font-family:var(--display);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);border-bottom:3px solid transparent}
  nav button.on{background:rgba(255,255,255,.03)}

  .strip{padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
  .strip b{color:var(--accent);font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}

  .pad{padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
  .card .top{padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .opp{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.1}
  .meta{font-size:12px;color:var(--dim);margin-top:2px}
  .chip{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;padding:3px 8px;border:1px solid var(--line);border-radius:4px;color:var(--dim);white-space:nowrap}
  .chip.hit{background:var(--accent);color:#0B0D10;border-color:var(--accent)}
  .picks{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
  .picks button{padding:12px 0;background:var(--panel);display:flex;flex-direction:column;align-items:center}
  .picks button .v{font-family:var(--display);font-size:26px;font-weight:800;line-height:1}
  .picks button .t{font-size:11px;opacity:.65;margin-top:2px}
  .picks button.sel{background:var(--accent);color:#0B0D10}
  .picks button.sel .t{opacity:.75}
  .picks button[disabled]{opacity:.4}
  .picks button.sel[disabled]{opacity:1}

  .peek{width:100%;padding:9px 16px;text-align:left;font-size:12px;color:var(--dim);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
  .peekbody{padding:2px 16px 12px;border-top:1px solid var(--line)}
  .dist{font-size:12px;color:var(--dim);padding:8px 0 6px}
  .prow{display:flex;align-items:center;gap:10px;padding:6px 0}
  .prow .pn{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .pv{width:28px;height:28px;flex:none;border:1px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:15px}
  .prow .pv.on{background:var(--accent);color:#0B0D10;border-color:var(--accent)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--accent);padding-bottom:env(safe-area-inset-bottom)}
  .bar .in{max-width:480px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
  .bar .k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
  .bar .s{font-size:12px;color:var(--dim);margin-top:2px}
  .bar .act{max-width:480px;margin:0 auto;padding:0 20px 14px}
  .bar .act button{width:100%;padding:13px;border-radius:6px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:13px}
  .bar .act .save{background:var(--accent);color:#0B0D10}
  .bar .act .save[disabled]{background:var(--line);color:var(--dim)}
  .bar .act .edit{background:transparent;border:1px solid var(--accent);color:var(--accent)}
  .bar .act .shut{text-align:center;font-size:12px;color:var(--dim);padding-top:2px}
  .bar .tot{font-family:var(--display);font-size:38px;font-weight:800;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}

  .hero{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
  .hero .tot{font-family:var(--display);font-size:48px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  h2.sec{font-family:var(--display);font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0}
  .rowhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .ghost{font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:5px;color:var(--dim)}

  .scope{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:16px}
  .scope button{padding:9px 0;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--dim)}
  .scope button.on{border-color:var(--accent);color:var(--accent)}
  .rank{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
  .rank.me{border-color:var(--accent)}
  .rank .head{width:100%;padding:12px 16px;display:flex;align-items:center;gap:12px;text-align:left}
  .rank .pos{font-family:var(--display);font-size:24px;font-weight:800;color:var(--dim);width:22px;flex:none;font-variant-numeric:tabular-nums}
  .rank .pos.first{color:var(--accent)}
  .rank .who{flex:1;min-width:0}
  .rank .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rank .who small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
  .rank .score{text-align:right}
  .rank .score b{display:block;font-family:var(--display);font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .rank .score small{font-size:12px;color:var(--dim)}
  .detail{padding:0 16px 12px;border-top:1px solid var(--line)}
  .strip8{display:flex;gap:4px}
  .strip8 div{flex:1;height:30px;border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:14px}

  .res{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
  .res .n{flex:1;min-width:0}
  .res .n div:first-child{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .res .n div:last-child{font-size:12px;color:var(--dim)}
  .res .set{display:flex;gap:4px}
  .res .set button{width:36px;height:36px;border:1px solid var(--line);border-radius:5px;font-family:var(--display);font-weight:700;color:var(--dim)}
  .hrow{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
  .hrow.me{border-color:var(--accent)}
  .hrow .pos{font-family:var(--display);font-size:18px;font-weight:800;color:var(--dim);width:18px;flex:none}
  .hrow .pos.first{color:var(--accent)}
  .hrow .hn{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hrow .hv{font-family:var(--display);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .hrow .hv small{font-size:12px;color:var(--dim);font-weight:600}
  .res .sc{display:flex;align-items:center;gap:5px}
  .res .sc input{width:38px;height:36px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:5px;color:var(--text);font-family:var(--display);font-weight:700;font-size:16px}
  .res .sc span{color:var(--dim)}
  .res .sc .ok{padding:0 10px;height:36px;border:1px solid var(--accent);border-radius:5px;color:var(--accent);font-size:12px}
  .res .sc .rm{width:30px;height:36px;border:1px solid var(--line);border-radius:5px;color:var(--dim)}
  .res.col{display:block}
  .res.col .n{margin-bottom:8px}
  .res .pts{display:flex;gap:5px;margin-top:6px}
  .res .pts button{width:38px;height:36px;border:1px solid var(--line);border-radius:5px;color:var(--dim);font-family:var(--display);font-weight:700;font-size:16px}
  .res .pts .ok{width:auto;padding:0 12px;border-color:var(--accent);color:var(--accent);font-family:var(--body);font-size:12px;font-weight:600}
  .res .pts .rm{width:auto;padding:0 12px;color:#E2725B;border-color:#5A2A2A;font-family:var(--body);font-size:12px;font-weight:600}
  .res .done{display:flex;align-items:center;gap:8px}
  .res .mini{padding:0 10px;height:32px;border:1px solid var(--line);border-radius:5px;color:var(--dim);font-size:12px}
  .res .mini.del{color:#E2725B;border-color:#5A2A2A}
  .res .pts .cancel{width:auto;padding:0 12px;color:var(--dim);font-family:var(--body);font-size:12px;font-weight:600}
  .res .skor{font-family:var(--display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
  .res .val{width:36px;text-align:center;font-family:var(--display);font-size:18px;font-weight:700}

  .wipe{width:100%;padding:11px;margin-bottom:14px;border:1px solid #5A2A2A;border-radius:6px;color:#E2725B;font-size:12px}
  .wipe{width:100%;padding:12px;margin:4px 0 24px;border:1px solid #5A2A2A;border-radius:6px;color:#E2725B;font-size:13px}
  .info{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;font-size:12px;line-height:1.7;color:var(--dim);margin-bottom:32px}
  .info b{color:var(--text);display:block;margin-bottom:6px;font-size:13px}
  .warn{margin:16px 20px 0;padding:10px 14px;border-radius:6px;background:#3A2A12;color:#F0CF9E;font-size:12px;line-height:1.5}
  .err{margin:16px 20px 0;padding:10px 14px;border-radius:6px;background:#3A1F1F;color:#F0B3A8;font-size:13px}
  .hidden{display:none}
</style>
</head>
<body>

<!-- Ayarlar config.js dosyasindan gelir; o dosya git'e girmez.
     Kurulum:  cp app/config.example.js app/config.js  -->
<script src="config.js"></script>
<script>
if (typeof CONFIG === "undefined") {
  window.CONFIG = { SUPABASE_URL: "", SUPABASE_ANON_KEY: "", ADMINS: [] };
  console.warn("config.js bulunamadi. app/config.example.js dosyasini kopyalayin.");
}
</script>

<div id="app"></div>

<script type="module">
import { empty, tally, standings, confirmedAt } from "./scoring.js";

/* ---------------- Fikstür ---------------- */
const TEAMS = {
  gs: {
    key:"gs", name:"Galatasaray", short:"GS",
    lock:"2026-09-09T19:00:00Z",
    theme:{bg:"#12100B",panel:"#1C1810",line:"#3A3120",accent:"#F5A800",text:"#F6EEDC",dim:"#9A8F76"},
    matches:[
      {d:"9 Eyl",  iso:"2026-09-09T19:00:00Z", opp:"Sporting CP",  home:false},
      {d:"13 Eki", iso:"2026-10-13T19:00:00Z", opp:"Barcelona",    home:true},
      {d:"21 Eki", iso:"2026-10-21T19:00:00Z", opp:"Lille",        home:false},
      {d:"3 Kas",  iso:"2026-11-03T19:00:00Z", opp:"Stuttgart",    home:true},
      {d:"24 Kas", iso:"2026-11-24T19:00:00Z", opp:"Aston Villa",  home:true},
      {d:"8 Ara",  iso:"2026-12-08T19:00:00Z", opp:"AEK",          home:false},
      {d:"19 Oca", iso:"2027-01-19T19:00:00Z", opp:"Feyenoord",    home:true},
      {d:"27 Oca", iso:"2027-01-27T19:00:00Z", opp:"PSG",          home:false}
    ]
  },
  fb: {
    key:"fb", name:"Fenerbahçe", short:"FB",
    lock:"2026-09-10T19:00:00Z",
    theme:{bg:"#080D18",panel:"#101828",line:"#20304C",accent:"#FFE500",text:"#E8EFFA",dim:"#7C8CA6"},
    matches:[
      {d:"10 Eyl", iso:"2026-09-10T19:00:00Z", opp:"Roma",              home:true},
      {d:"14 Eki", iso:"2026-10-14T19:00:00Z", opp:"Aston Villa",       home:false},
      {d:"20 Eki", iso:"2026-10-20T19:00:00Z", opp:"Slavia Praha",      home:true},
      {d:"4 Kas",  iso:"2026-11-04T19:00:00Z", opp:"Liverpool",         home:true},
      {d:"25 Kas", iso:"2026-11-25T19:00:00Z", opp:"Shakhtar Donetsk",  home:false},
      {d:"9 Ara",  iso:"2026-12-09T19:00:00Z", opp:"LASK",              home:false},
      {d:"20 Oca", iso:"2027-01-20T19:00:00Z", opp:"Villarreal",        home:true},
      {d:"27 Oca", iso:"2027-01-27T19:00:00Z", opp:"Atlético Madrid",   home:false}
    ]
  }
};
const NEUTRAL = {bg:"#0B0D10",panel:"#14181E",line:"#252C36",accent:"#C8D2E0",text:"#EDF1F6",dim:"#7D8794"};
const ART = '<svg class="shake" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Iki kisi el ele tutusuyor"><defs><pattern id="gsp" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#A90432"/><rect width="8" height="18" fill="#F5A800"/></pattern><pattern id="fbp" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#12356E"/><rect width="8" height="18" fill="#FFE500"/></pattern></defs><circle cx="100" cy="46" r="21" fill="#E9D9BE" stroke="#0B0D10" stroke-width="3"/><path d="M 79,44 A 21,21 0 0 1 121,44 Z" fill="#2A2117"/><rect x="92" y="60" width="16" height="14" fill="#E9D9BE"/><path d="M 68,90 L 56,120" stroke="#E9D9BE" stroke-width="13" stroke-linecap="round" fill="none"/><path d="M 132,90 L 145,116" stroke="#E9D9BE" stroke-width="13" stroke-linecap="round" fill="none"/><rect x="74" y="124" width="52" height="28" rx="6" fill="#191E26"/><rect x="79" y="148" width="15" height="34" rx="7" fill="#E9D9BE"/><rect x="106" y="148" width="15" height="34" rx="7" fill="#E9D9BE"/><rect x="59" y="68" width="17" height="24" rx="8" fill="url(#gsp)" stroke="#0B0D10" stroke-width="3"/><rect x="124" y="68" width="17" height="24" rx="8" fill="url(#gsp)" stroke="#0B0D10" stroke-width="3"/><rect x="72" y="66" width="56" height="66" rx="12" fill="url(#gsp)" stroke="#0B0D10" stroke-width="3"/><circle cx="200" cy="46" r="21" fill="#E9D9BE" stroke="#0B0D10" stroke-width="3"/><path d="M 179,44 A 21,21 0 0 1 221,44 Z" fill="#2A2117"/><rect x="192" y="60" width="16" height="14" fill="#E9D9BE"/><path d="M 232,90 L 244,120" stroke="#E9D9BE" stroke-width="13" stroke-linecap="round" fill="none"/><path d="M 168,90 L 155,116" stroke="#E9D9BE" stroke-width="13" stroke-linecap="round" fill="none"/><rect x="174" y="124" width="52" height="28" rx="6" fill="#191E26"/><rect x="179" y="148" width="15" height="34" rx="7" fill="#E9D9BE"/><rect x="206" y="148" width="15" height="34" rx="7" fill="#E9D9BE"/><rect x="159" y="68" width="17" height="24" rx="8" fill="url(#fbp)" stroke="#0B0D10" stroke-width="3"/><rect x="224" y="68" width="17" height="24" rx="8" fill="url(#fbp)" stroke="#0B0D10" stroke-width="3"/><rect x="172" y="66" width="56" height="66" rx="12" fill="url(#fbp)" stroke="#0B0D10" stroke-width="3"/><circle cx="150" cy="115" r="12" fill="#F3EBDA" stroke="#0B0D10" stroke-width="3"/></svg>';
const PICKS = [{v:3,t:"Galibiyet"},{v:1,t:"Beraberlik"},{v:0,t:"Mağlubiyet"}];

/* ---------------- Durum ---------------- */
const S = {
  view:"gs", me:null, players:[], results:{gs:empty(),fb:empty()}, scores:{gs:empty(),fb:empty()}, lastErr:"",
  open:null, editing:false, msg:"", loading:true, poll:null,
  step:"name", nameDraft:"", found:null, openMatch:null, ptDraft:{}, editRow:null, scope:"gs"
};
const online = () => !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- Veri katmanı ---------------- */
async function api(path, opts) {
  opts = opts || {};
  const base = CONFIG.SUPABASE_URL.replace(/\/+$/,"").replace(/\/rest\/v1$/,"");
  const r = await fetch(base + "/rest/v1/" + path, Object.assign({}, opts, {
    headers: Object.assign({
      apikey: CONFIG.SUPABASE_ANON_KEY,
      Authorization: "Bearer " + CONFIG.SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    }, opts.headers || {})
  }));
  if (!r.ok) {
    const body = await r.text();
    throw new Error("HTTP " + r.status + " — " + body.slice(0, 200));
  }
  const text = await r.text();
  if (!text) return null;
  try { return JSON.parse(text); } catch (e) { return null; }
}

async function pull() {
  if (!online()) {
    const raw = localStorage.getItem("tl_local");
    if (raw) { const d = JSON.parse(raw); S.players = d.players || []; S.results = d.results || {gs:empty(),fb:empty()}; }
    return;
  }
  const rows = await api("entries?select=key,data");
  const players = [];
  let results = {gs:empty(), fb:empty()};
  rows.forEach(r => {
    if (r.key === "results") {
      results = {gs:r.data.gs||empty(), fb:r.data.fb||empty()};
      S.scores = {gs:r.data.sgs||empty(), fb:r.data.sfb||empty()};
    }
    else if (r.key.indexOf("player:") === 0) players.push(r.data);
  });
  S.players = players;
  S.results = results;
  if (S.me) { const fresh = players.find(p => p.id === S.me.id); if (fresh) S.me = fresh; }
}

async function push(key, data) {
  if (!online()) {
    const d = {players:S.players, results:S.results};
    localStorage.setItem("tl_local", JSON.stringify(d));
    return true;
  }
  try {
    await api("entries", {
      method:"POST",
      headers:{Prefer:"resolution=merge-duplicates,return=minimal"},
      body: JSON.stringify({key:key, data:data, updated_at:new Date().toISOString()})
    });
    return true;
  } catch(e) { console.error(e); S.lastErr = e.message || String(e); return false; }
}

/* ---------------- Puanlama ---------------- */
/* tally, standings, confirmedAt: app/scoring.js içinde, testleri orada. */
const LOCK_LEAD = 60 * 60 * 1000;                       // ilk maçtan 1 saat önce
const lockAt = k => new Date(TEAMS[k].lock).getTime() - LOCK_LEAD;
const locked = k => Date.now() >= lockAt(k);

/* ---------------- Eylemler ---------------- */
function normName(n){ return String(n||"").trim().replace(/\s+/g," "); }
function keyName(n){ return normName(n).toLocaleLowerCase("tr"); }

async function hashPin(text) {
  try {
    const buf = new TextEncoder().encode(text);
    const h = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,"0")).join("");
  } catch (e) { return "p:" + text; }
}

async function stepName() {
  const v = normName((document.getElementById("nameInput")||{}).value);
  if (!v) { S.msg = "Bir takma ad yaz."; render(); return; }
  S.nameDraft = v;
  try { await pull(); } catch (e) {}
  S.found = S.players.find(p => keyName(p.name) === keyName(v)) || null;
  S.step = "pin"; S.msg = ""; render();
  const el = document.getElementById("pinInput"); if (el) el.focus();
}

function stepBack() { S.step = "name"; S.msg = ""; S.found = null; render(); }

async function stepPin() {
  const pin = String((document.getElementById("pinInput")||{}).value || "").trim();
  if (!/^[0-9]{6}$/.test(pin)) { S.msg = "Şifre 6 rakamdan oluşmalı."; render(); return; }
  const h = await hashPin(keyName(S.nameDraft) + ":" + pin);

  if (S.found) {
    if (S.found.pin && S.found.pin !== h) { S.msg = "Şifre yanlış."; render(); return; }
    if (!S.found.pin) {                       // eski kayıt: ilk girişte şifre belirlenir
      S.found.pin = h; S.found.updatedAt = Date.now();
      if (!(await push("player:" + S.found.id, S.found))) { S.msg = "Kaydedilemedi — " + S.lastErr; render(); return; }
    }
    localStorage.setItem("tl_me", S.found.id);
    S.me = S.found; S.msg = ""; S.step = "name"; render(); return;
  }

  const me = {
    id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    name: S.nameDraft, pin: h,
    gs: empty(), fb: empty(), conf:{gs:null,fb:null}, updatedAt: Date.now()
  };
  if (!(await push("player:" + me.id, me))) { S.msg = "Kaydedilemedi — " + S.lastErr; render(); return; }
  S.players.push(me);
  localStorage.setItem("tl_me", me.id);
  S.me = me; S.msg = ""; S.step = "name"; render();
}

function signOut() {
  localStorage.removeItem("tl_me");
  S.me = null; S.step = "name"; S.found = null; S.nameDraft = ""; S.view = "gs"; S.msg = "";
  render();
}

async function pick(team, i, v) {
  if (!S.me || locked(team) || confirmedAt(S.me, team)) return;
  S.me[team] = (S.me[team] || empty()).slice();
  S.me[team][i] = S.me[team][i] === v ? null : v;
  S.me.updatedAt = Date.now();
  const idx = S.players.findIndex(p => p.id === S.me.id);
  if (idx >= 0) S.players[idx] = S.me;
  render();
  const ok = await push("player:" + S.me.id, S.me);
  if (!ok) { S.msg = "Tahmin kaydedilemedi — " + S.lastErr; render(); }
}
async function confirmTeam(team) {
  if (!S.me || locked(team)) return;
  if ((S.me[team] || empty()).filter(x => x !== null).length < 8) return;
  S.me.conf = Object.assign({gs:null, fb:null}, S.me.conf);
  S.me.conf[team] = Date.now();
  S.me.updatedAt = Date.now();
  render();
  if (!(await push("player:" + S.me.id, S.me))) { S.msg = "Kaydedilemedi — " + S.lastErr; render(); }
}
async function editTeam(team) {
  if (!S.me || locked(team)) return;
  S.me.conf = Object.assign({gs:null, fb:null}, S.me.conf);
  S.me.conf[team] = null;
  S.me.updatedAt = Date.now();
  render();
  if (!(await push("player:" + S.me.id, S.me))) { S.msg = "Kaydedilemedi — " + S.lastErr; render(); }
}
function isAdmin() {
  const list = CONFIG.ADMINS || [];
  return !!S.me && list.some(n => keyName(n) === keyName(S.me.name));
}
function scorePayload() {
  return {gs:S.results.gs, fb:S.results.fb, sgs:S.scores.gs, sfb:S.scores.fb};
}
async function saveScore(team, i) {
  if (!isAdmin()) return;
  const g = el => parseInt(String(((document.getElementById(el)||{}).value) || "").trim(), 10);
  const f = g("sf_" + team + "_" + i), a = g("sa_" + team + "_" + i);
  if (!(f >= 0) || !(a >= 0)) { S.msg = "Skoru iki rakam olarak gir."; render(); return; }
  const key = team + ":" + i;
  const p = (S.ptDraft[key] !== undefined && S.ptDraft[key] !== null)
    ? S.ptDraft[key]
    : (f > a ? 3 : (f === a ? 1 : 0));
  delete S.ptDraft[key];
  if (S.editRow === key) S.editRow = null;
  S.results[team] = S.results[team].slice(); S.results[team][i] = p;
  S.scores[team]  = S.scores[team].slice();  S.scores[team][i]  = [f, a];
  S.msg = ""; render();
  if (!(await push("results", scorePayload()))) { S.msg = "Sonuç kaydedilemedi — " + S.lastErr; render(); }
}
async function clearAllScores() {
  if (!isAdmin()) return;
  if (!confirm("Girilen bütün skorlar ve puanlar silinecek. Emin misin?")) return;
  S.results = {gs:empty(), fb:empty()};
  S.scores  = {gs:empty(), fb:empty()};
  S.msg = ""; render();
  if (!(await push("results", scorePayload()))) { S.msg = "Silinemedi — " + S.lastErr; render(); }
}
async function clearAll() {
  if (!isAdmin()) return;
  if (!confirm("Girilen bütün skorlar ve puanlar silinecek. Emin misin?")) return;
  S.results = {gs:empty(), fb:empty()};
  S.scores  = {gs:empty(), fb:empty()};
  S.ptDraft = {};
  render();
  if (!(await push("results", scorePayload()))) { S.msg = "Sıfırlanamadı — " + S.lastErr; render(); }
}
async function clearScore(team, i) {
  if (!isAdmin()) return;
  S.results[team] = S.results[team].slice(); S.results[team][i] = null;
  S.scores[team]  = S.scores[team].slice();  S.scores[team][i]  = null;
  render();
  if (!(await push("results", scorePayload()))) { S.msg = "Sonuç silinemedi — " + S.lastErr; render(); }
}
function setPt(team, i, v) {
  if (!isAdmin()) return;
  S.ptDraft[team + ":" + i] = v;
  render();
}
function openRow(team, i) {
  if (!isAdmin()) return;
  S.editRow = team + ":" + i;      // aynı anda tek maç açık
  render();
}
function closeRow(team, i) {
  if (S.editRow === team + ":" + i) S.editRow = null;
  delete S.ptDraft[team + ":" + i];
  render();
}
function setScope(v) { S.scope = v; S.open = null; render(); }
function peek(id) {
  S.openMatch = (S.openMatch === id) ? null : id;
  render();
  if (S.openMatch) refresh();
}
function toggleEdit() {
  if (!isAdmin()) return;
  S.editing = !S.editing; S.msg = ""; render();
}
async function refresh() {
  try { await pull(); S.msg = ""; } catch(e) { S.msg = "Veri alınamadı — " + (e.message || e); }
  render();
}
function go(v) {
  S.view = v; S.open = null; render();
  if (v === "board") refresh();
}

/* ---------------- Görünüm ---------------- */
function theme() {
  const t = S.view === "board" ? NEUTRAL : TEAMS[S.view].theme;
  const r = document.documentElement.style;
  r.setProperty("--bg",t.bg); r.setProperty("--panel",t.panel); r.setProperty("--line",t.line);
  r.setProperty("--accent",t.accent); r.setProperty("--text",t.text); r.setProperty("--dim",t.dim);
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", t.bg);
}

function countdownText(ms) {
  const diff = ms - Date.now();
  if (diff <= 0) return null;
  const d = Math.floor(diff/86400000), h = Math.floor(diff%86400000/3600000),
        m = Math.floor(diff%3600000/60000), s = Math.floor(diff%60000/1000);
  const p = n => String(n).padStart(2,"0");
  return d + "g " + p(h) + ":" + p(m) + ":" + p(s);
}

function joinScreen() {
  const art = ART;
  if (S.step === "pin") {
    const yeni = !S.found;
    return '<div id="join"><div>' + art +
      '<h1 class="big">' + esc(S.nameDraft) + '</h1>' +
      '<p class="lead">' + (yeni
        ? 'Bu ad henüz kullanılmamış. Kendine 6 rakamlı bir şifre belirle; bir dahaki girişte bu şifreyle hesabına dönersin.'
        : 'Bu ad kayıtlı. Hesabına girmek için 6 rakamlı şifreni yaz.') + '</p>' +
      '<label class="lbl" for="pinInput">' + (yeni ? 'Şifre belirle' : 'Şifren') + '</label>' +
      '<input id="pinInput" class="field" inputmode="numeric" pattern="[0-9]*" maxlength="6" ' +
        'placeholder="6 rakam" autocomplete="off" onkeydown="if(event.key===\'Enter\')stepPin()">' +
      '<button class="primary" onclick="stepPin()">' + (yeni ? 'Hesabı oluştur' : 'Giriş yap') + '</button>' +
      (S.msg ? '<p class="fine" style="color:#E2725B">' + esc(S.msg) + '</p>' : '') +
      '<button class="back" onclick="stepBack()">← Adı değiştir</button>' +
      '</div></div>';
  }
  return '<div id="join"><div>' + art +
    '<h1 class="big">Tahmin Ligi</h1>' +
    '<p class="lead">Galatasaray ve Fenerbahçe\'nin 8\'er Şampiyonlar Ligi maçı. Her maç için alınacak puanı tahmin et, toplamı en yakın tutturan kazanır.</p>' +
    '<label class="lbl" for="nameInput">Takma adın</label>' +
    '<input id="nameInput" class="field" placeholder="Arkadaşların seni nasıl tanıyor?" ' +
      'autocomplete="off" value="' + esc(S.nameDraft||"") + '" onkeydown="if(event.key===\'Enter\')stepName()">' +
    '<button class="primary" onclick="stepName()">Devam</button>' +
    (S.msg ? '<p class="fine" style="color:#E2725B">' + esc(S.msg) + '</p>' : '') +
    '<p class="fine">Aynı adı daha önce kullandıysan şifrenle kendi hesabına dönersin. Yeni bir adsa şifreni bir sonraki adımda belirlersin.' +
      (online() ? '' : '<br><br>Uyarı: sunucu ayarlanmamış, veriler yalnızca bu telefonda kalır.') + '</p>' +
    '</div></div>';
}

function teamView(k) {
  const T = TEAMS[k], picks = S.me[k] || empty();
  const hardLock = locked(k), conf = confirmedAt(S.me, k), lk = hardLock || !!conf;
  const predicted = picks.reduce((a,b)=>a+(b||0),0);
  const filled = picks.filter(p=>p!==null).length;
  const res = S.results[k];
  const earned = res.reduce((a,b)=>a+(b||0),0);
  const played = res.filter(x=>x!==null).length;

  let html = '<div class="strip">' + (hardLock
    ? '<span>Tahminler kilitlendi — ' + T.matches[0].d + ' maçından 1 saat önce</span>'
    : '<span>' + (conf ? 'Kaydedildi · kilide kalan' : 'Kilide kalan') + '</span>' +
      '<b id="cd">' + (countdownText(lockAt(k))||"") + '</b>') + '</div><div class="pad">';

  T.matches.forEach((m,i) => {
    const mine = picks[i], actual = res[i];
    const hit = actual !== null && mine !== null && actual === mine;
    const miss = actual !== null && mine !== null && actual !== mine;
    html += '<div class="card"><div class="top"><div>' +
      '<div class="opp">' + esc(m.opp) + '</div>' +
      '<div class="meta">' + m.d + ' · ' + (m.home ? "İç saha" : "Deplasman") + '</div></div>' +
      (actual !== null ? '<span class="chip' + (hit ? ' hit' : '') + '">' + (hit ? "Tuttu" : miss ? "Kaçtı" : "Sonuç " + actual) + '</span>' : '') +
      '</div><div class="picks">';
    PICKS.forEach(p => {
      const sel = mine === p.v;
      html += '<button class="' + (sel?'sel':'') + '"' + (lk?' disabled':'') +
        ' onclick="pick(\'' + k + '\',' + i + ',' + p.v + ')">' +
        '<span class="v">' + p.v + '</span><span class="t">' + p.t + '</span></button>';
    });
    html += '</div>';

    const pid = k + ':' + i;
    const open = S.openMatch === pid;
    if (hardLock) {
      const votes = S.players.map(p => ({ name: p.name, v: (p[k] || empty())[i] }))
        .sort((x,y) => (y.v === null ? -1 : y.v) - (x.v === null ? -1 : x.v) ||
                        x.name.localeCompare(y.name, "tr"));
      const cnt = v => votes.filter(x => x.v === v).length;
      html += '<button class="peek" onclick="peek(\'' + pid + '\')">' +
        '<span>Herkesin tahmini</span><span>3: ' + cnt(3) + ' · 1: ' + cnt(1) + ' · 0: ' + cnt(0) +
        (open ? ' ▴' : ' ▾') + '</span></button>';
      if (open) {
        html += '<div class="peekbody">';
        if (!votes.length) html += '<div class="dist">Kimse tahmin girmemiş.</div>';
        votes.forEach(x => {
          const right = actual !== null && x.v !== null && x.v === actual;
          html += '<div class="prow"><span class="pn">' + esc(x.name) + '</span>' +
            '<span class="pv' + (right ? ' on' : '') + '">' + (x.v === null ? '·' : x.v) + '</span></div>';
        });
        html += '</div>';
      }
    } else {
      html += '<div class="peek"><span>Herkesin tahmini</span><span>kilitten sonra açılır</span></div>';
    }
    html += '</div>';
  });

  html += '</div><div class="bar"><div class="in"><div>' +
    '<div class="k">' + T.short + ' tahmin toplamın</div>' +
    '<div class="s">' + filled + '/8 maç işaretlendi' + (played ? ' · gerçekleşen ' + earned + ' puan (' + played + ' maç)' : '') + '</div>' +
    '</div><div class="tot">' + predicted + '</div></div><div class="act">' +
    (hardLock
      ? '<div class="shut">Tahminler kesinleşti, değiştirilemez.</div>'
      : conf
        ? '<button class="edit" onclick="editTeam(\'' + k + '\')">Düzenle</button>'
        : '<button class="save"' + (filled < 8 ? ' disabled' : '') +
          ' onclick="confirmTeam(\'' + k + '\')">' +
          (filled < 8 ? '8 maçın hepsini işaretle' : 'Kaydet ve kilitle') + '</button>') +
    '</div></div>';
  return html;
}

function boardView() {
  const st = standings(S.players, S.results, S.scope, {revealed: locked(S.scope)});
  let html = '<div class="pad">';
  html += '<div class="scope">';
  [["gs","Galatasaray"],["fb","Fenerbahçe"]].forEach(o => {
    html += '<button class="' + (S.scope === o[0] ? 'on' : '') + '" onclick="setScope(\'' + o[0] + '\')">' + o[1] + '</button>';
  });
  html += '</div>';
  html += '<div class="hero"><div><div class="k lbl" style="margin:0">' +
    TEAMS[st.scope].name + ' kaç puan topladı' + '</div>' +
    '<div class="meta" style="margin-top:6px">' + st.played + '/' + st.total + ' maç girildi' +
    (st.finished ? ' · tamamlandı' : '') + '</div></div>' +
    '<div class="tot">' + st.at + '</div></div>';

  html += '<div class="rowhead"><h2 class="sec">Sıralama</h2>' +
    '<button class="ghost" onclick="refresh()">Yenile</button></div>' +
    '<p class="meta" style="margin:-4px 0 14px">' + (st.played
      ? (st.finished
          ? 'Toplam puanı tam tutturan kazanır. Tutturan yoksa en çok yaklaşan kazanmış sayılır.'
          : 'Sıralama, o ana kadarki toplama yakınlığa göre. Kesin sonuç 8 maç bitince belli olur.')
      : 'Maçlar oynandıkça sıralama burada oluşacak.') + '</p>';

  if (!st.rows.length) {
    html += '<p class="meta" style="margin-bottom:32px">Henüz kimse katılmadı. Linki arkadaşlarına gönder.</p>';
  } else {
    st.rows.forEach((p,i) => {
      const mine = S.me && p.id === S.me.id;
      const open = S.open === p.id;
      html += '<div class="rank' + (mine?' me':'') + '">' +
        '<button class="head" onclick="S.open=' + (open?'null':"'"+p.id+"'") + ';render()">' +
        '<span class="pos' + (i===0 && st.played ? ' first':'') + '">' +
          (st.played ? (i+1) : '·') + '</span>' +
        '<span class="who"><b>' + esc(p.name) + (mine?' (sen)':'') + '</b><small>' +
          (st.revealed
            ? 'puan tahmini ' + p.total + (st.played ? ' · ' + p.hits + '/' + st.played + ' maç doğru' : '')
            : 'tahminler kilitten sonra açılır') +
        '</small></span>' +
        '<span class="score">' + (st.played
          ? '<b>' + (st.finished ? Math.abs(p.total-st.at) : p.hits) + '</b>' +
            '<small>' + (st.finished ? 'fark' : 'doğru') + '</small>'
          : '') + '</span>' +
        '</button>';
      if (open) {
        html += '<div class="detail">';
        if (mine || st.revealed) {
          ["gs","fb"].forEach(k => {
            html += '<div style="padding-top:12px"><div class="lbl">' + TEAMS[k].short + '</div><div class="strip8">';
            (p[k]||empty()).forEach((v,j) => {
              const a = S.results[k][j];
              const hit = a !== null && v !== null && a === v;
              html += '<div style="' + (hit ? 'background:' + TEAMS[k].theme.accent + ';color:#0B0D10;border-color:' + TEAMS[k].theme.accent : (v===null?'color:var(--dim)':'')) + '">' + (v===null?'·':v) + '</div>';
            });
            html += '</div></div>';
          });
        } else {
          html += '<p class="meta" style="padding-top:12px">Tahminler ilk maçlar başlayınca herkese açılır.</p>';
        }
        html += '</div>';
      }
      html += '</div>';
    });
    html += '<div style="height:20px"></div>';
  }

  const admin = isAdmin();
  if (st.played) {
    const byHits = st.rows.slice().sort((a,b) =>
      b.hits - a.hits ||
      Math.abs(a.total-st.at) - Math.abs(b.total-st.at));
    html += '<div class="rowhead" style="margin-top:26px"><h2 class="sec">En çok maç bilen</h2></div>' +
      '<p class="meta" style="margin:-4px 0 12px">Yan sıralama. Kazananı belirlemez, maçları en iyi okuyanı gösterir.</p>';
    byHits.forEach((p,i) => {
      const mine = S.me && p.id === S.me.id;
      html += '<div class="hrow' + (mine ? ' me' : '') + '">' +
        '<span class="pos' + (i===0 ? ' first' : '') + '">' + (i+1) + '</span>' +
        '<span class="hn">' + esc(p.name) + (mine ? ' (sen)' : '') + '</span>' +
        '<span class="hv">' + p.hits + '<small>/' + st.played + '</small></span>' +
        '</div>';
    });
    html += '<div style="height:12px"></div>';
  }

  html += '<div class="rowhead"><h2 class="sec">Maç sonuçları</h2>' +
    (admin ? '<button class="ghost" onclick="toggleEdit()">' + (S.editing ? "Girişi kapat" : "Sonuç gir") + '</button>' : '') +
    '</div>' +
    (admin && S.editing
      ? '<button class="wipe" onclick="clearAllScores()">Bütün skorları sil</button>'
      : '') +
    '<p class="meta" style="margin:0 0 16px">' + (admin
      ? 'Maçın yanındaki Gir düğmesine bas, skoru yaz. Kazanan tarafa göre 3, beraberlikte 1, yenilgide 0 puan otomatik hesaplanır.'
      : 'Skorları yalnızca yarışma sorumlusu giriyor.') + '</p>';

  ["gs","fb"].forEach(k => {
    html += '<div style="margin-bottom:20px"><div class="lbl" style="color:' + TEAMS[k].theme.accent + '">' + TEAMS[k].name + '</div>';
    TEAMS[k].matches.forEach((m,i) => {
      const done = Date.now() >= new Date(m.iso).getTime();
      const v = S.results[k][i];
      const sc = (S.scores[k] || empty())[i];
      const dk = k + ':' + i;
      const editing = admin && S.editing && S.editRow === dk;
      html += '<div class="res' + (editing ? ' col' : '') + '">' +
        '<div class="n"><div>' + esc(m.opp) + '</div><div>' + m.d + ' · ' + (m.home?"İç saha":"Deplasman") + '</div></div>';
      if (editing) {
        html += '<div class="sc">' +
          '<input id="sf_' + k + '_' + i + '" inputmode="numeric" maxlength="2" placeholder="' + TEAMS[k].short + '" value="' + (sc ? sc[0] : '') + '">' +
          '<span>-</span>' +
          '<input id="sa_' + k + '_' + i + '" inputmode="numeric" maxlength="2" placeholder="Rk" value="' + (sc ? sc[1] : '') + '">' +
          '</div>';
        const cur = (S.ptDraft[dk] !== undefined && S.ptDraft[dk] !== null) ? S.ptDraft[dk] : v;
        html += '<div class="pts">';
        PICKS.forEach(pp => {
          const on = cur === pp.v;
          html += '<button onclick="setPt(\'' + k + '\',' + i + ',' + pp.v + ')" style="' +
            (on ? 'background:' + TEAMS[k].theme.accent + ';color:#0B0D10;border-color:' + TEAMS[k].theme.accent : '') +
            '">' + pp.v + '</button>';
        });
        html += '<button class="ok" onclick="saveScore(\'' + k + '\',' + i + ')">Kaydet</button>' +
          '<button class="cancel" onclick="closeRow(\'' + k + '\',' + i + ')">Vazgeç</button>' +
          '</div>';
      } else {
        html += '<div class="done">' +
          (sc ? '<span class="skor">' + sc[0] + '-' + sc[1] + '</span>' : '') +
          '<span class="val" style="' + (v===null?'color:var(--dim)':'') + '">' +
            (v===null ? (done?'—':'·') : v) + '</span>' +
          (admin && S.editing
            ? (v === null
                ? '<button class="mini" onclick="openRow(\'' + k + '\',' + i + ')">Gir</button>'
                : '<button class="mini" onclick="openRow(\'' + k + '\',' + i + ')">Düzenle</button>' +
                  '<button class="mini del" onclick="clearScore(\'' + k + '\',' + i + ')">Sil</button>')
            : '') +
          '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });

  if (admin && S.editing) {
    html += '<button class="wipe" onclick="clearAll()">Tüm sonuçları sıfırla</button>';
  }

  html += '<div class="info"><b>Kazanan nasıl belirlenir</b>' +
    'Her takım için ayrı yarışma var. Asıl iş, o takımın 8 maçta toplayacağı puanı bilmek:<br><br>' +
    '1. Toplamı tam tutturan kazanır. Tutturan yoksa en çok yaklaşan kazanmış sayılır.<br>' +
    '2. Aynı farka sahip olanlar arasında, maç bazında daha çok doğru bilen öne geçer. Bu her sıra için geçerli.<br>' +
    '3. O da eşitse, tahminini önce kesinleştiren üstte.<br><br>' +
    'Altındaki “en çok maç bilen” listesi ayrı bir gösterge. Kazananı belirlemez.</div>';

  html += '</div>';
  return html;
}

function render() {
  theme();
  const app = document.getElementById("app");

  if (S.loading) { app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--dim)">Yükleniyor…</div>'; return; }
  if (!S.me) { app.innerHTML = joinScreen(); return; }

  const tabs = [["gs","Galatasaray","#F5A800"],["fb","Fenerbahçe","#FFE500"],["board","Sıralama","#C8D2E0"]];
  let html = '<div class="wrap"><header><h1>Tahmin Ligi</h1>' +
    '<button class="out" onclick="signOut()">' + esc(S.me.name) + ' &middot; Çıkış</button>' +
    '</header><nav>';
  tabs.forEach(t => {
    const on = S.view === t[0];
    html += '<button class="' + (on?'on':'') + '" style="color:' + (on?t[2]:'var(--dim)') + ';border-bottom-color:' + (on?t[2]:'transparent') + '" onclick="go(\'' + t[0] + '\')">' + t[1] + '</button>';
  });
  html += '</nav>';
  if (!online()) html += '<div class="warn">Sunucu ayarlanmamış: veriler yalnızca bu cihazda tutuluyor, arkadaşların göremez.</div>';
  if (S.msg) html += '<div class="err">' + esc(S.msg) + '</div>';
  html += (S.view === "board" ? boardView() : teamView(S.view));
  html += '</div>';
  app.innerHTML = html;
}

/* ---------------- Global erişim ---------------- */
/* type="module" içindeki üst düzey bildirimler window'a eklenmez;
   inline onclick="..." öznitelikleri bu isimlere ihtiyaç duyuyor. */
Object.assign(window, {
  S, render, go, stepName, stepBack, stepPin, signOut, pick, confirmTeam, editTeam,
  saveScore, clearAllScores, clearAll, clearScore, setPt, openRow, closeRow,
  setScope, peek, toggleEdit, refresh
});

/* ---------------- Başlangıç ---------------- */
(async function init(){
  render();
  try { await pull(); } catch(e) { S.msg = "Veri alınamadı — " + (e.message || e); }
  const id = localStorage.getItem("tl_me");
  if (id) { const f = S.players.find(p => p.id === id); if (f) S.me = f; }
  S.loading = false;
  render();

  setInterval(() => {
    const el = document.getElementById("cd");
    if (el && S.view !== "board") {
      const txt = countdownText(lockAt(S.view));
      if (txt) el.textContent = txt; else render();
    }
  }, 1000);

  setInterval(() => { if (S.view === "board" && !S.editing) refresh(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
